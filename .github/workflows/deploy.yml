name: Deploy p5.js game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Necessario per deploy-pages: https://docs.github.com/en/pages/getting-started-with-github-pages/using-custom-workflows-with-github-pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # p5.js è un sito statico: non serve build, basta caricare la cartella.
      # fetch("data.json") e loadImage("car.png") funzionano su Pages perché
      # è servito via HTTP (in locale da file:// sono bloccati dal CORS,
      # per questo devi usare `python3 -m http.server`).
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
